name: Validate and deliver channels
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to deliver
        type: choice
        options: [edge, stable]
        default: edge
      stable_verified:
        description: Stable passed the documented real-account and security release checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: channels-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: |
          pip install --require-hashes --only-binary=:all: -r retrace/requirements.lock
      - run: pip check
      - name: Check runtime advisories and expiring applicability notes
        run: python tools/audit-python.py
      - run: npm ci --prefix tools/ui-tests --ignore-scripts --no-audit --no-fund
      - name: Isolated synthetic tests (no Apple credentials)
        env:
          PYTHONPATH: retrace/rootfs/app
        run: python -m unittest discover -s tests -v
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: pip install homeassistant==2026.9.3
      - name: Native discovery and credential renewal regression tests
        run: python -m unittest discover -s tests/native -v
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate integration with pinned official hassfest image
        run: docker run --rm -v "$PWD:/github/workspace" ghcr.io/home-assistant/hassfest@sha256:b200bb178c5c62f984c2c705c820bd991e5308d6cba6987d24c7d643919ab5cc
  deliver:
    needs: [test, native, hassfest]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Render selected channel
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel || 'edge' }}
          STABLE_VERIFIED: ${{ inputs.stable_verified }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REQUESTED_CHANNEL" = stable ] && [ "$STABLE_VERIFIED" != true ]; then
            echo 'Stable requires the documented live validation.' >&2
            exit 1
          fi
          VERSION=$(sed -n 's/^version: *//p' retrace/config.yaml)
          if [ "$REQUESTED_CHANNEL" = edge ]; then
            VERSION="$VERSION-dev.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          if [ "$REQUESTED_CHANNEL" = edge ]; then
            python tools/render-channel.py edge "$VERSION" "$RUNNER_TEMP/channel-tree" --runtime shared
          else
            echo 'Stable runtime promotion remains blocked pending the release review.' >&2
            exit 1
          fi
          echo "CHANNEL=$REQUESTED_CHANNEL" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish channel with normal fast-forward Git history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git show-ref --verify --quiet "refs/remotes/origin/$CHANNEL"; then
            if [ "$CHANNEL" = stable ] && git show "origin/stable:CHANNEL.json" | grep -Fq "\"version\": \"$VERSION\""; then
              echo 'Stable versions are immutable; increase the source version.' >&2
              exit 1
            fi
            git checkout -B delivery "origin/$CHANNEL"
          else
            git checkout --orphan delivery
          fi
          git rm -rf --ignore-unmatch .
          cp -a "$RUNNER_TEMP/channel-tree/." .
          git add .
          git commit -m "Deliver $CHANNEL $VERSION from $GITHUB_SHA"
          git push origin "HEAD:refs/heads/$CHANNEL"
      - name: Publish matching integration release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$CHANNEL" = edge ]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" \
            --title "Retrace $CHANNEL $VERSION" \
            --notes "Tested source and companion integration. App repository: https://github.com/$GH_REPO#$CHANNEL. Experimental: review docs/SECURITY.md and docs/RELEASE.md. No public container binary is included." \
            "${FLAGS[@]}"
